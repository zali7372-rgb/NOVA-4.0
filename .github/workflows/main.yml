      - name: Find Gradle project
        run: |
          echo "Projekt fájlok:"
          find . -maxdepth 3 -type f \( -name "settings.gradle.kts" -o -name "build.gradle.kts" \)

      - name: Build NOVA APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -name settings.gradle.kts -print -quit)")
          echo "Gradle projekt: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon

      - name: Upload NOVA APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-debug-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
